name: Playwright Tests

# Cuándo correr el pipeline
on:
  push:
    branches: [main]          # en cada push a main
  pull_request:
    branches: [main]          # en cada PR hacia main

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-22.04     # ubuntu 22 — más estable para Playwright


    # Esto le dice a GitHub Actions que use la imagen oficial de Playwright
    container:
      image: mcr.microsoft.com/playwright:v1.38.0-jammy

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar Node.js versión 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'          # cachea node_modules para ir más rápido

      # 3. Instalar dependencias del proyecto
      #    npm ci es más estricto que npm install — ideal para CI
      #    lee el package-lock.json y no permite cambios inesperados
      - name: Install dependencies
        run: npm ci

      # No necesitas instalar browsers — ya vienen en la imagen
      - name: Run Playwright tests
        run: npx playwright test
        env:
          HOME: /root

      # 6. Subir el reporte HTML como artifact descargable
      #    if: always() — sube el reporte AUNQUE los tests fallen
      #    sin esto, si fallan los tests no habría reporte para ver qué pasó
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30    # el reporte se guarda 30 días en GitHub