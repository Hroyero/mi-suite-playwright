name: Playwright Tests

# Cuándo correr el pipeline
on:
  push:
    branches: [main]          # en cada push a main
  pull_request:
    branches: [main]          # en cada PR hacia main

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest    # máquina virtual de GitHub

    steps:
      # 1. Descargar el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'          # cachea node_modules para ir más rápido

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci             # más estricto que npm install — ideal para CI

      # 4. Instalar browsers de Playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # 5. Correr los tests
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Subir el reporte — siempre, aunque fallen los tests
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()            # ← clave — sube el reporte aunque haya fallos
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30